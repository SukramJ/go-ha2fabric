# GitHub Actions CI for go-ha2fabric, the form of the sibling repositories
# (go-zendure2mqtt, go-fabric-server): lint (go vet + gofumpt + golangci-lint
# + go.mod tidiness), security (govulncheck + go-licenses + the gitleaks
# history scan — the daemon reads a Home Assistant token), test (the OS
# triplet, race detector on, so CGo for that single step), coverage (the
# per-package floors), fuzz-smoke (every target of the Makefile's
# FUZZ_TARGETS), build (the binary, the release dry run) and docker (both
# images, amd64, no push). The lint job also holds the pins (actions by full
# SHA with the version comment, base images by digest: decision 62), the
# security job the generated licence tree (decision 59).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.27.4"
  # Pinned, not @latest: a tool release must not turn an unrelated pull
  # request red. Keep in step with `make setup`.
  GOFUMPT_VERSION: "v0.12.0"
  GOLANGCI_LINT_VERSION: "v2.14.0"
  GOVULNCHECK_VERSION: "v1.8.0"
  GOLICENSES_VERSION: "v1.6.0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@${{ env.GOFUMPT_VERSION }}
          make fmt-check
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          golangci-lint config verify
          golangci-lint run --timeout=5m ./...
      - name: go.mod tidiness
        run: make tidy-check
      - name: citations at go.mod's versions
        run: make cite
      - name: actions by full SHA, base images by digest
        run: |
          bad=$(grep -nE '^[[:space:]]*(- )?uses:' .github/workflows/*.yml |
            grep -vE 'uses: [^ ]+@[0-9a-f]{40} # v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -n "$bad" ]; then echo "an action not pinned by SHA with its # vX.Y.Z:"; echo "$bad"; exit 1; fi
          bad=$(grep -nE '^FROM ' Dockerfile addon/Dockerfile |
            grep -vE '@sha256:[0-9a-f]{64}( AS [a-z0-9-]+)?$' | grep -vE ':FROM base-\$\{BUILD_ARCH\}$' || true)
          if [ -n "$bad" ]; then echo "a base image not pinned by digest:"; echo "$bad"; exit 1; fi

  security:
    name: security (vuln + licenses + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          make vuln
      - name: go-licenses
        run: |
          go install github.com/google/go-licenses@${{ env.GOLICENSES_VERSION }}
          make licenses
      - name: gitleaks
        run: make secrets
      - name: the licence tree is current
        run: script/licenses/generate.sh --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout=600s ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: cover-check
        run: make cover-check

  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: fuzz-smoke
        run: make fuzz-smoke FUZZTIME=20000x

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build
        run: make build
      - name: the daemon answers --version
        run: bin/ha2fabric --version
      - name: release dry run
        run: make release
      - name: every archive carries the licence texts
        run: |
          for a in dist/*.tar.gz; do
            tar -tzf "$a" | grep -q '/licenses/MODULES.txt$' || { echo "$a has no licenses/"; exit 1; }
          done

  docker:
    name: docker (both images, amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the daemon image
        run: docker build -t go-ha2fabric:ci .
      - name: the add-on image
        run: docker build --build-arg BUILD_ARCH=amd64 -f addon/Dockerfile -t go-ha2fabric-addon:ci .
      - name: the daemon image runs
        run: docker run --rm go-ha2fabric:ci --version
      - name: both images carry the licence texts
        run: |
          for img in go-ha2fabric:ci go-ha2fabric-addon:ci; do
            id=$(docker create "$img")
            docker cp "$id:/usr/share/doc/go-ha2fabric/licenses/MODULES.txt" - | tar -xO | diff - licenses/MODULES.txt
            docker rm "$id" >/dev/null
          done
